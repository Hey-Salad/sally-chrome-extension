<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="16" height="16" rx="3.2" fill="url(#grad)"/>

  <!-- Salad layers (3 horizontal lines representing lettuce/ingredients) -->
  <g stroke="white" stroke-width="1.28" stroke-linecap="round">
    <line x1="4" y1="5.6" x2="12" y2="5.6" opacity="0.8"/>
    <line x1="4" y1="8" x2="12" y2="8"/>
    <line x1="4" y1="10.4" x2="12" y2="10.4" opacity="0.8"/>
  </g>
</svg>