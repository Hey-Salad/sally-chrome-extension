<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="25.6" fill="url(#grad)"/>

  <!-- Salad layers (3 horizontal lines representing lettuce/ingredients) -->
  <g stroke="white" stroke-width="10.24" stroke-linecap="round">
    <line x1="32" y1="44.8" x2="96" y2="44.8" opacity="0.8"/>
    <line x1="32" y1="64" x2="96" y2="64"/>
    <line x1="32" y1="83.2" x2="96" y2="83.2" opacity="0.8"/>
  </g>
</svg>