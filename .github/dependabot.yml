# Weekly dependency PRs. Security updates are enabled separately in
# Settings -> Code security (Needs Peter, SECURITY-AUDIT INFRA-05).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
