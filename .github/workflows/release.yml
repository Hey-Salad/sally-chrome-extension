name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/sally-chrome-extension-${GITHUB_REF_NAME}.zip" . \
            -x "*.git*" \
            -x "*.DS_Store" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".github/*" \
            -x "dist/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sally-chrome-extension-${{ github.ref_name }}
          path: dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
